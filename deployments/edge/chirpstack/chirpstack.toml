# Configuração do ChirpStack v4 para o Brasil — região AU915 sub-banda 0 (AUD-001 G1-R01)
# Variáveis $EDGE_PG_USER, $EDGE_PG_PASSWORD, $CHIRPSTACK_API_SECRET e $CHIRPSTACK_MQTT_PASSWORD
# são expandidas nativamente pelo ChirpStack v4 a partir do ambiente do contêiner.
[logging]
  level = "info"

[postgresql]
  dsn = "postgres://$EDGE_PG_USER:$EDGE_PG_PASSWORD@postgres/chirpstack?sslmode=disable"

[redis]
  servers = ["redis://redis/"]

[network]
  net_id = "000000"
  enabled_regions = ["au915_0"]

[api]
  bind = "0.0.0.0:8080"
  secret = "$CHIRPSTACK_API_SECRET"

[integration]
  enabled = ["mqtt"]

  [integration.mqtt]
    server = "tcp://mosquitto:1883/"
    username = "chirpstack"
    password = "$CHIRPSTACK_MQTT_PASSWORD"
    json = true
    event_topic = "application/{{application_id}}/device/{{dev_eui}}/event/{{event}}"
    command_topic = "application/{{application_id}}/device/{{dev_eui}}/command/{{command}}"

# TERRANET EDGE — Sobreposição (Override) ARM de Baixo Consumo (<= 5 W) (AUD-001 §10, ARQ-002 §8)
#
# Uso (sempre composto sobre docker-compose.yml para incluir a stack LoRaWAN completa):
#   docker compose -f deployments/edge/docker-compose.yml -f deployments/edge/docker-compose.arm.yml up -d
#
# Ajustes aplicados pelo perfil ARM:
# * Limites de memória em TODOS os serviços (PostgreSQL/ChirpStack/Redis/Mosquitto/Bridge/EDGE)
# * TERRANET EDGE usa SQLite WAL em volume persistente (reduz conexões/IO no PostgreSQL)
# * Intervalo de sincronização ampliado para reduzir despertares do modem LTE
# * Pronto para mapear adaptador USB-RS485 (/dev/ttyUSB0) para Modbus RTU

services:
  postgres:
    mem_limit: 192m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]

  redis:
    mem_limit: 48m

  mosquitto:
    mem_limit: 48m

  chirpstack:
    mem_limit: 160m

  chirpstack-gateway-bridge:
    mem_limit: 48m

  terranet-edge:
    mem_limit: 160m
    environment:
      TERRANET_EDGE_DB_URL: sqlite:////data/edge.db
      TERRANET_SYNC_INTERVAL_S: "15"
      TERRANET_CONFIG_POLL_S: "120"
    volumes:
      - edge_arm_data:/data
    # Descomente quando o conversor USB-RS485 estiver conectado ao EDGE ARM:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  prometheus:
    mem_limit: 128m

volumes:
  edge_arm_data:

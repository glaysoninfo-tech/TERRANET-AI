# ACL MQTT do TERRANET EDGE (AUD-001 G1-R01 / PIT-001 §10.2)
# Separa a camada de entrada (Gateway Bridge / ChirpStack) dos tópicos canônicos TERRANET.

user gw_bridge
topic readwrite au915_0/gateway/#

user chirpstack
topic readwrite au915_0/gateway/#
topic readwrite application/+/device/+/event/+
topic readwrite application/+/device/+/command/+

user terranet_edge
topic read application/+/device/+/event/+
topic write application/+/device/+/command/down
topic readwrite terranet/v1/#

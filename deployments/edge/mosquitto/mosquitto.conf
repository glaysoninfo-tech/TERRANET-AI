# Mosquitto local endurecido do TERRANET EDGE (PIT-001 §10, §19.2, POC-001 Gate 1)
# Gere o arquivo de senhas com:
#   mosquitto_passwd -c -b /mosquitto/config/passwd terranet_edge <SENHA_EDGE>
#   mosquitto_passwd -b /mosquitto/config/passwd chirpstack <SENHA_CHIRPSTACK>
listener 1883
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf
max_queued_messages 10000

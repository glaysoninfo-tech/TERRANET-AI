# Mosquitto local endurecido do TERRANET EDGE (AUD-001 G1-R01, PIT-001 §10, §19.2)
# O arquivo /mosquitto/data/passwd é gerado automaticamente no startup por entrypoint.sh.
listener 1883
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl.conf
max_queued_messages 10000

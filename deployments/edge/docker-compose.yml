# TERRANET EDGE — Stack de referência (PIT-001 §5, §17.3, §18)
# Antes de produzir em campo, substitua todas as credenciais via arquivo .env (nunca use padrões).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EDGE_PG_USER:-terranet_edge}
      POSTGRES_PASSWORD: ${EDGE_PG_PASSWORD:?defina EDGE_PG_PASSWORD}
      POSTGRES_DB: ${EDGE_PG_DB:-terranet_edge}
    volumes:
      - edge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDGE_PG_USER:-terranet_edge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - edge_redis_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - edge_mqtt_data:/mosquitto/data

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: unless-stopped
    command: -c /etc/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./chirpstack:/etc/chirpstack:ro
    environment:
      POSTGRESQL_HOST: postgres
      REDIS_HOST: redis
      MQTT_BROKER_HOST: mosquitto

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "au915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "au915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "au915_0/gateway/{{ .GatewayID }}/command/#"
      INTEGRATION__MQTT__SERVER: "tcp://mosquitto:1883"
    depends_on:
      - mosquitto

  terranet-edge:
    build:
      context: ../..
      dockerfile: deployments/edge/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      TERRANET_EDGE_ID: ${TERRANET_EDGE_ID:-EDGE-001}
      TERRANET_EDGE_DB_URL: postgresql://${EDGE_PG_USER:-terranet_edge}:${EDGE_PG_PASSWORD:?defina EDGE_PG_PASSWORD}@postgres:5432/${EDGE_PG_DB:-terranet_edge}
      TERRANET_MQTT_HOST: mosquitto
      TERRANET_MQTT_PORT: "1883"
      TERRANET_CORE_URL: ${TERRANET_CORE_URL:-}
      TERRANET_EDGE_TOKEN: ${TERRANET_EDGE_TOKEN:-}
      TERRANET_MASTER_KEY: ${TERRANET_MASTER_KEY:?defina TERRANET_MASTER_KEY}
      TERRANET_EDGE_METRICS_PORT: "9101"
    ports:
      - "127.0.0.1:9101:9101"

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - edge_prom_data:/prometheus

volumes:
  edge_pg_data:
  edge_redis_data:
  edge_mqtt_data:
  edge_prom_data:

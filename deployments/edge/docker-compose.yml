# TERRANET EDGE — Stack de referência (PIT-001 §5, §17.3, §18, AUD-001 G1-R01)
# Todas as credenciais são injetadas via .env (nunca use senhas padrão em campo).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EDGE_PG_USER:-terranet_edge}
      POSTGRES_PASSWORD: ${EDGE_PG_PASSWORD:?defina EDGE_PG_PASSWORD}
      POSTGRES_DB: ${EDGE_PG_DB:-terranet_edge}
    volumes:
      - edge_pg_data:/var/lib/postgresql/data
      - ./postgres/init-chirpstack-db.sh:/docker-entrypoint-initdb.d/01-chirpstack.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EDGE_PG_USER:-terranet_edge} -d ${EDGE_PG_DB:-terranet_edge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - edge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      EDGE_MQTT_PASSWORD: ${EDGE_MQTT_PASSWORD:?defina EDGE_MQTT_PASSWORD}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:?defina CHIRPSTACK_MQTT_PASSWORD}
      GW_BRIDGE_MQTT_PASSWORD: ${GW_BRIDGE_MQTT_PASSWORD:?defina GW_BRIDGE_MQTT_PASSWORD}
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - edge_mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u terranet_edge -P \"$EDGE_MQTT_PASSWORD\" -t terranet/v1/healthcheck -C 1 -W 1 >/dev/null 2>&1 || [ $$? -eq 27 ]"]
      interval: 5s
      timeout: 5s
      retries: 10

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: unless-stopped
    command: -c /etc/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CHIRPSTACK_HTTP_PORT:-8080}:8080"
    volumes:
      - ./chirpstack:/etc/chirpstack:ro
    environment:
      EDGE_PG_USER: ${EDGE_PG_USER:-terranet_edge}
      EDGE_PG_PASSWORD: ${EDGE_PG_PASSWORD:?defina EDGE_PG_PASSWORD}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET:?defina CHIRPSTACK_API_SECRET}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:?defina CHIRPSTACK_MQTT_PASSWORD}

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "au915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "au915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "au915_0/gateway/{{ .GatewayID }}/command/#"
      INTEGRATION__MQTT__AUTH__GENERIC__SERVERS: "tcp://mosquitto:1883"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: "gw_bridge"
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: "${GW_BRIDGE_MQTT_PASSWORD:?defina GW_BRIDGE_MQTT_PASSWORD}"
    depends_on:
      mosquitto:
        condition: service_healthy

  terranet-edge:
    build:
      context: ../..
      dockerfile: deployments/edge/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      TERRANET_EDGE_ID: ${TERRANET_EDGE_ID:-EDGE-001}
      TERRANET_EDGE_DB_URL: postgresql://${EDGE_PG_USER:-terranet_edge}:${EDGE_PG_PASSWORD:?defina EDGE_PG_PASSWORD}@postgres:5432/${EDGE_PG_DB:-terranet_edge}
      TERRANET_MQTT_HOST: mosquitto
      TERRANET_MQTT_PORT: "1883"
      TERRANET_MQTT_USER: terranet_edge
      TERRANET_MQTT_PASSWORD: ${EDGE_MQTT_PASSWORD:?defina EDGE_MQTT_PASSWORD}
      TERRANET_CORE_URL: ${TERRANET_CORE_URL:-}
      TERRANET_EDGE_TOKEN: ${TERRANET_EDGE_TOKEN:-}
      TERRANET_MASTER_KEY: ${TERRANET_MASTER_KEY:?defina TERRANET_MASTER_KEY}
      TERRANET_SYNC_INTERVAL_S: ${TERRANET_SYNC_INTERVAL_S:-5}
      TERRANET_CONFIG_POLL_S: ${TERRANET_CONFIG_POLL_S:-60}
      TERRANET_EDGE_METRICS_PORT: "9101"
    ports:
      - "127.0.0.1:9101:9101"

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - edge_prom_data:/prometheus

volumes:
  edge_pg_data:
  edge_redis_data:
  edge_mqtt_data:
  edge_prom_data:
